name: smart_classroom
description: 灵动课堂 - 课堂互动管理工具（AGPL-3.0 开源协议）
publish_to: 'none'
version: 1.32.2+2

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # intl 不能删：gen-l10n 生成的 app_localizations.dart 会直接 import 它
  intl: ^0.20.2
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  flutter_secure_storage: ^9.0.0
  file_picker: 10.3.8
  http: ^1.2.0
  audioplayers: ^6.0.0
  uuid: ^4.3.3
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.4
  excel: ^3.0.0
  pdfrx: ^1.0.100
  path: ^1.8.3
  crypto: ^3.0.3
  webdav_plus: ^1.2.0

# 已移除的依赖及原因（避免以后有人再按旧印象加回来）：
#   dio                       —— lib/ 中零 import；webdav_plus 1.2.2 依赖的是 http，不是 dio
#   archive                   —— lib/ 中零 import；excel 会自带
#   xml                       —— lib/ 中零 import；webdav_plus 会自带
#   flutter_local_notifications —— lib/ 中零 import，从未被调用；
#                                 而界面上的开源清单还把它列着，属于“列了一个没用的库”。
#                                 真的要用通知时再加回来（届时还要补 POST_NOTIFICATIONS 权限）。

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: true
  # 注意：assets/wallpapers/ 已移除。
  # 该目录下曾放着 20.3 MB 的壁纸，而 lib/ 里对它的引用数为 0 ——
  # 也就是说这些图会原封不动被打进 APK 与 Windows ZIP，却从没有任何代码去加载。
  # 图标主图已移到不被打包的 branding/app_icon.png，由 tools/make_icons.py 派生各尺寸。
  assets:
    - assets/sounds/
    - assets/textbook_index.json

# ============================================================
# Workflow 文件自校验
#
# 存在的理由：GitHub 对语法无效的 workflow **不会让 push 报错**，
# 只是悄悄把那个文件标为失效。本仓库已经踩过一次 ——
# 一个 run: | 块里藏了顶格的续行，整个文件解析失败，
# 而表面上看起来像「workflow 跑了但没做事」。
#
# 关键在于：本文件必须与被校验的对象解耦。
# 如果 build.yml 坏了，build.yml 自己不会运行来报告自己坏了；
# 而这个文件是独立的，push 改动了任何 workflow 文件都会触发它，
# 于是由它来指出问题。
# ============================================================
name: Workflow lint

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'tools/check_workflows.py'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tools/check_workflows.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 校验 workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Validate all workflow files
        run: python3 tools/check_workflows.py

# ============================================================
# Android + Windows CI
# 产出：Android APK (3 ABIs) + Windows ZIP + Windows Setup.exe
#
# 设计要点：
# 1. verify 先跑静态分析与单元测试，两个构建 job 都 needs 它。
# 2. **PR 只跑 verify**。以前每次 PR 都会顺带编译 Android + Windows，
#    两个 runner 十几分钟起步；而 PR 阶段真正需要回答的问题只有
#    「能不能编译 / 测试过不过」，完整产物交给 main。
# 3. flutter analyze 只把**编译级错误**当失败（--no-fatal-warnings --no-fatal-infos）：
#    代码库仍有历史告警，一上来全当失败只会得到一个没用的红叉。
# 4. 【关键】分析与测试都先捕获退出码、不中断 job，把输出写成
#    docs/analyzer-report.md 并回提交，**最后**才因失败而收尾。
#    因为这份报告是维护者能看到分析器/测试输出的唯一通道。
# 5. 版本号不写死：从 pubspec.yaml 读，单一来源。
# 6. 【发布方式】
#    - 推 tag（v*）→ 发布
#    - 或：提交信息里带 [release] → 发布
#      后者是为了在没有 tag 推送权限、或不想额外开一个 workflow 创建 tag 时
#      仍能发布。action-gh-release 会在 tag 不存在时自己创建。
#      两条路径都仍然被 `needs` 把关，编译错误或单测失败时不会产生发布。
# 7. 回提交必须带 rebase 重试：verify 与 Maintenance 会在同一次 push 上
#    同时往 main 提交，先到的那一个会让后到的 push 被拒（非快进）。
#    旧实现直接 `git push`，于是 Maintenance 在 2026-09-25 那次 push 上
#    整条流水线失败 —— 而它其实什么代码都没写错。
# ============================================================
name: Build & Release

on:
  push:
    branches: [main, master, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: 构建完成后创建 Release（仅 main 上有效）
        type: boolean
        default: false

# 同一分支上的新 push 取消旧构建；PR 更激进，省 runner 时间。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  actions: read

env:
  APP_NAME: SmartClassroom
  FLUTTER_VERSION: '3.44.9'
  PUB_CACHE: ${{ github.workspace }}/.pub-cache

jobs:
  # ==========================================================
  # 静态分析 + 单元测试
  # ==========================================================
  verify:
    name: 静态分析与测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # 回提交要用 rebase，浅克隆会让 rebase 直接失败
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Read version from pubspec
        id: version
        run: |
          v=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -1)
          if [ -z "$v" ]; then
            echo "::error::无法从 pubspec.yaml 解析出语义化版本号"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "本次构建版本: $v"

      - name: Get dependencies
        run: flutter pub get

      # l10n 产物不入库（.gitignore 已排除），每次都由 ARB 生成。
      # `flutter pub get` 通常已经跑过，这里显式再跑一次，避免依赖它的副作用。
      - name: Generate localizations
        run: flutter gen-l10n

      # ---- 不在这里失败：先让输出落盘，否则失败时反而拿不到任何细节 ----
      - name: Analyze
        id: analyze
        run: |
          set +e
          flutter analyze --fatal-infos > analyze-raw.txt 2>&1
          code=$?
          cat analyze-raw.txt
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run unit tests
        id: test
        run: |
          set +e
          flutter test --reporter expanded > test-raw.txt 2>&1
          code=$?
          cat test-raw.txt
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build diagnostic report
        if: always()
        run: |
          mkdir -p docs
          {
            echo "# CI 静态分析与测试报告"
            echo
            echo "本文件由 CI 的 verify job 自动生成，请勿手工编辑。"
            echo
            echo "- 生成时间：$(date -u '+%Y-%m-%d %H:%M:%SZ')"
            echo "- 触发：${{ github.event_name }} @ ${{ github.ref_name }}"
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- Flutter：$(flutter --version | head -1)"
            echo "- \`flutter analyze\` 退出码：${{ steps.analyze.outputs.exit }}"
            echo "- \`flutter test\` 退出码：${{ steps.test.outputs.exit }}"
            echo
            echo "## flutter analyze"
            echo
            echo '```text'
            cat analyze-raw.txt 2>/dev/null || echo "（无输出）"
            echo '```'
            echo
            echo "## flutter test"
            echo
            echo '```text'
            tail -400 test-raw.txt 2>/dev/null || echo "（无输出）"
            echo '```'
          } > docs/analyzer-report.md
          echo "报告行数: $(wc -l < docs/analyzer-report.md)"
          grep -E "issues? found|No issues" analyze-raw.txt | tail -1 || true

      # Actions 日志需要 actions:read 才能下载，而注解随运行页面公开可见。
      # 因此把分析结果切成几段 warning 注解贴出来：维护者不用登录也能看到
      # 「剩下哪些问题、在哪个文件」。
      - name: Annotate analyzer findings
        if: always()
        run: |
          set +e
          if [ ! -s analyze-raw.txt ]; then
            echo "::notice title=flutter analyze::没有分析输出"
            exit 0
          fi
          # flutter analyze 的行首有缩进，不能锚定 ^info
          pat='^[[:space:]]*(info|warning|error) • '
          count=$(grep -cE "$pat" analyze-raw.txt)
          echo "::notice title=flutter analyze::共 $count 条问题（完整输出见 docs/analyzer-report.md）"
          if [ "$count" = "0" ]; then
            # 0 条却失败，说明是分析器自身出错，把尾部输出贴出来
            tail_out=$(tail -12 analyze-raw.txt | paste -sd ' | ' | cut -c1-3500)
            echo "::warning title=flutter analyze（无问题行但退出码非 0）::$tail_out"
            exit 0
          fi
          rm -f /tmp/ann_*
          grep -E "$pat" analyze-raw.txt | head -60 | split -l 6 - /tmp/ann_
          for f in /tmp/ann_*; do
            [ -e "$f" ] || continue
            msg=$(paste -sd ' | ' "$f" | cut -c1-3500)
            echo "::warning title=flutter analyze::$msg"
          done

      # 把报告与锁文件回提交（仅限 main 的 push）。
      # GITHUB_TOKEN 触发的 push 不会再触发其他 workflow，不会递归。
      - name: Commit report & pubspec.lock
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/analyzer-report.md pubspec.lock
          if git diff --cached --quiet; then
            echo "报告与锁文件均无变化，跳过提交。"
            exit 0
          fi
          git diff --cached --stat
          git commit \
            -m "chore(ci): 刷新 CI 诊断报告与 pubspec.lock" \
            -m "由 verify job 自动生成。docs/analyzer-report.md 请勿手工编辑。"

          for i in 1 2 3 4 5; do
            if git push; then
              echo "已推送报告（第 $i 次尝试）"
              exit 0
            fi
            echo "::warning::push 被拒绝，rebase 到最新 main 后重试（第 $i 次）"
            git fetch origin main
            git rebase FETCH_HEAD || { git rebase --abort || true; }
            sleep $((i * 3))
          done
          echo "::error::报告提交连续 5 次被拒绝，放弃"
          exit 1

      # 报告已落盘、已提交，现在才真正失败
      - name: Fail if analyzer reported errors
        if: always() && steps.analyze.outputs.exit != '0'
        run: |
          echo "::error::flutter analyze 发现编译级错误，详情见 docs/analyzer-report.md"
          exit 1

      - name: Fail if tests failed
        if: always() && steps.test.outputs.exit != '0'
        run: |
          echo "::error::单元测试失败，详情见 docs/analyzer-report.md"
          exit 1

  # ==========================================================
  # Android
  # ==========================================================
  build-android:
    name: Android Build
    needs: verify
    # 只在会发版的分支 / tag / 手动触发时打包
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Configure release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次 APK 使用 debug 签名（仅适合自用，不能作为正式分发）"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          echo "已配置 release 签名"

      - name: Create local.properties
        run: |
          echo "flutter.sdk=${FLUTTER_ROOT}" > android/local.properties
          echo "flutter.buildMode=release" >> android/local.properties
          echo "flutter.versionName=${{ needs.verify.outputs.version }}" >> android/local.properties
          echo "flutter.versionCode=${{ github.run_number }}" >> android/local.properties

      - name: Clean stale build artifacts
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Build split APKs
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=${{ needs.verify.outputs.version }} \
            --build-number=${{ github.run_number }}

      - name: Package APKs
        run: |
          set -euo pipefail
          V="${{ needs.verify.outputs.version }}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            dst="${{ env.APP_NAME }}_v${V}_${abi}.apk"
            cp "$src" "$dst"
            size=$(du -h "$dst" | cut -f1)
            echo "$dst  $size"
            echo "- \`$dst\` — $size" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: ${{ env.APP_NAME }}_v*.apk
          if-no-files-found: error
          retention-days: 14

  # ==========================================================
  # Windows
  # ==========================================================
  build-windows:
    name: Windows Build
    needs: verify
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/develop'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          architecture: x64

      - name: Enable Windows
        run: flutter config --enable-windows-desktop

      # 仓库里的 windows/ 工程完整时直接用；缺失才重建。
      # 旧实现无条件删除重建，于是每次构建都会把自定义窗口标题、
      # 以及 icons workflow 生成的应用图标覆盖回 Flutter 默认值。
      - name: Ensure Windows project exists
        shell: pwsh
        run: |
          if (Test-Path 'windows/runner/main.cpp') {
            Write-Host "使用仓库内的 Windows 工程"
          } else {
            Write-Host "::warning::windows/ 工程不完整，临时用 flutter create 重建"
            Remove-Item -Recurse -Force windows -ErrorAction SilentlyContinue
            flutter create --platforms=windows --org=com.zhuomostudio --project-name=smart_classroom .
          }

      - name: Set MSVC compatibility
        shell: pwsh
        run: |
          echo "CL=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        shell: pwsh
        run: flutter build windows --release

      # ----- 产物 1：绿色版 ZIP -----
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $V = "${{ needs.verify.outputs.version }}"
          $zipName = "${{ env.APP_NAME }}_v${V}_windows.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $zipName
          echo "ZIP_PATH=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $mb = [math]::Round((Get-Item $zipName).Length / 1MB, 1)
          Write-Host "$zipName  $mb MB"
          "- ``$zipName`` — $mb MB" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ${{ env.APP_NAME }}_v*_windows.zip
          if-no-files-found: error
          retention-days: 14

      # ----- 产物 2：Inno Setup 安装包 -----
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress 2>&1 | Out-Null
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if ($iscc) {
            Write-Host "ISCC found: $($iscc.Source)"
          } else {
            Write-Host "ISCC not in PATH, searching..."
            $paths = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe",
              "${env:ProgramFiles}\Inno Setup 6\iscc.exe",
              "${env:LOCALAPPDATA}\Programs\Inno Setup 6\iscc.exe"
            )
            foreach ($p in $paths) {
              if (Test-Path $p) {
                Write-Host "Found ISCC at: $p"
                echo "ISCC_PATH=$p" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                break
              }
            }
          }

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          Copy-Item installer/setup.iss setup.iss -Force

          # setup.iss 的 SetupIconFile 指向 windows\runner\resources\app_icon.ico。
          # 该文件以前根本不在仓库里（本地构建必失败），
          # 现在由 tools/make_icons.py + Generate icons workflow 生成并提交。
          if (-not (Test-Path 'windows\runner\resources\app_icon.ico')) {
            throw 'app_icon.ico 缺失，请先跑一次 Generate icons workflow'
          }

          $iscc = $env:ISCC_PATH
          if (-not $iscc) { $iscc = "iscc.exe" }

          # 版本号从 pubspec 传进去：setup.iss 里写死过 1.25.0，
          # 结果安装包叫新版本、控制面板里显示旧版本。
          $V = "${{ needs.verify.outputs.version }}"
          & $iscc "/DMyAppVersion=$V" setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

          $setupName = "${{ env.APP_NAME }}_v${V}_Setup.exe"
          Copy-Item build/installer/*.exe $setupName -Force
          $mb = [math]::Round((Get-Item $setupName).Length / 1MB, 1)
          Write-Host "$setupName  $mb MB"
          "- ``$setupName`` — $mb MB" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: ${{ env.APP_NAME }}_v*_Setup.exe
          if-no-files-found: error
          retention-days: 14

  # ==========================================================
  # Release
  #
  # 触发方式：
  #   1. 推 tag v*                     —— 常规发布
  #   2. 提交信息含 [release]          —— 无需 tag 推送权限也能发布
  #   3. 手动 workflow_dispatch 且勾选 release
  # 都要先过 needs（verify + 两端构建），所以编译/测试不过时不会发布。
  # ==========================================================
  release:
    needs: [verify, build-android, build-windows]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: |
          ls -la release-assets/
          echo "--- 各产物体积 ---"
          du -h release-assets/* | sort -h

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: 灵动课堂 v${{ needs.verify.outputs.version }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

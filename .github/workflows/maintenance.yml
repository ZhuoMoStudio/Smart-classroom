# ============================================================
# 维护 Workflow：把「能交给工具链做」的事交出去
#
# 一次做四件事，都不需要人工逐条编辑：
#   1. 从 SPDX 取 AGPL-3.0 的**权威正文**写入 LICENSE。
#      手打 34 KB 法律文本，错一个字符文本就失去意义，所以不手打。
#   2. tools/fix_textbook_index.py：把教材索引里混进来的非学段顶层键
#      （实测有一个「学数学最重要的刷习题在这里」，19 本）搬移到 _未分类 下。
#      是搬移不是删除 —— 数据放错层级不该被抹掉。
#   3. dart fix --apply：Dart 官方工具，自动处理无用 import、缺少的大括号、
#      const 提示等。CI 报告里 137 条告警大部分由它一次清掉。
#   4. tools/gen_third_party.py：从 pubspec.lock + pub 缓存生成第三方协议清单。
#      手写清单一定会腐烂（仓库里那份 18 行的手写清单已经不准了）。
#
# 【安全边界】dart fix 会改 lib/ 下的代码，而自动改动不经人眼。
# 因此改完之后必须先跑 flutter analyze + flutter test：
# 两者都通过才提交；任何一个失败就 git checkout -- lib/ test/ 回滚，
# 只保留许可证/索引/文档这类无风险变更。
#
# 触发：push 改动 tools/** 或本文件，或手动 workflow_dispatch。
# 注意：GITHUB_TOKEN 触发的 push 不会再触发其他 workflow（防递归），
# 所以这次提交之后需要再推一次代码才会跑 Build & Release。
# ============================================================
name: Maintenance

on:
  push:
    paths:
      - 'tools/**'
      - '.github/workflows/maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintain:
    name: 刷新许可证与自动修复
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44'
          channel: 'stable'
          cache: true

      # ---------- 1) AGPL-3.0 权威正文 ----------
      - name: Fetch canonical AGPL-3.0 text
        run: |
          set -euo pipefail
          url_main="https://raw.githubusercontent.com/spdx/license-list-data/main/text/AGPL-3.0-only.txt"
          url_master="https://raw.githubusercontent.com/spdx/license-list-data/master/text/AGPL-3.0-only.txt"

          if curl -fsSL -o LICENSE.new "$url_main"; then
            echo "已从 main 分支取得"
          else
            echo "main 分支取不到，改用 master"
            curl -fsSL -o LICENSE.new "$url_master"
          fi

          test -s LICENSE.new
          # 基本校验：正文必须包含标题与关键条款，避免把 404 页面当许可证写进去
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE.new
          grep -q "Version 3, 19 November 2007" LICENSE.new
          wc -c LICENSE.new
          head -3 LICENSE.new

          mv LICENSE.new LICENSE

      # ---------- 2) 教材索引清理 ----------
      - name: Fix textbook index
        run: python3 tools/fix_textbook_index.py

      # ---------- 3) 依赖 + dart fix ----------
      - name: Get dependencies
        run: flutter pub get

      - name: Apply dart fix
        run: |
          set -euo pipefail
          dart fix --apply 2>&1 | tail -40 || true
          echo "--- dart fix 之后的 git 改动 ---"
          git --no-pager diff --stat

      - name: Verify automated edits
        id: verify
        run: |
          set +e
          flutter analyze --no-fatal-warnings --no-fatal-infos > verify-analyze.txt 2>&1
          a=$?
          flutter test > verify-test.txt 2>&1
          t=$?
          echo "---- analyze (tail) ----"; tail -8 verify-analyze.txt
          echo "---- test (tail) ----"; tail -8 verify-test.txt
          echo "analyze=$a test=$t"
          if [ "$a" = "0" ] && [ "$t" = "0" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Revert code edits if verification failed
        if: steps.verify.outputs.ok != 'true'
        run: |
          echo "::warning::dart fix 的结果未通过 analyze/test，已回滚代码改动，只保留许可证与文档类变更"
          git checkout -- lib/ test/ || true
          git --no-pager diff --stat

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-verify-logs
          path: |
            verify-analyze.txt
            verify-test.txt
          if-no-files-found: ignore

      # ---------- 4) 第三方协议清单（必须在 pub get 之后） ----------
      - name: Generate third-party manifest
        run: python3 tools/gen_third_party.py

      - name: Show resulting changes
        run: |
          git status --short
          git --no-pager diff --stat

      - name: Commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A LICENSE assets/textbook_index.json docs/third-party.md lib test

          if git diff --cached --quiet; then
            echo "没有任何变化，跳过提交。"
            exit 0
          fi

          echo "--- 本次提交内容 ---"
          git diff --cached --stat

          git commit \
            -m "chore(maintenance): 刷新许可证 / 教材索引 / 第三方清单 / lint 自动修复" \
            -m "由 Maintenance workflow 自动生成。" \
            -m "LICENSE: SPDX 的 AGPL-3.0-only 权威正文" \
            -m "assets/textbook_index.json: 非学段顶层键搬移到 _未分类" \
            -m "docs/third-party.md: 从 pubspec.lock 生成的协议清单" \
            -m "lib/ test/: dart fix --apply（仅在 analyze+test 通过时才保留）"

          git push

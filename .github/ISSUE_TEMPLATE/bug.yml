name: Bug 反馈
description: 报告一个可复现的问题（崩溃、数据丢失、同步失败等）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先看一眼 [运行日志](https://github.com/ZhuoMoStudio/Smart-classroom#数据存放)：
        工作区的 `数据存档/运行日志.log` 里通常已经有错误堆栈。
        **提交前请删掉学生姓名、学校名、WebDAV 账号等隐私信息。**

  - type: input
    id: version
    attributes:
      label: 版本
      description: 设置页底部或安装包文件名里的版本号
      placeholder: "v1.32.2"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Android（手机 / 平板）
        - Windows（希沃一体机 / 电脑）
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开应用开始，一步一步写清楚
      placeholder: |
        1. 打开「班级」页
        2. 导入名单 xxx.xlsx
        3. 点「抽取」
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有截图更好；崩溃请贴日志里 `ERROR` 开头的几行
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除日志/截图中的学生姓名、学校名与云端账号
          required: true

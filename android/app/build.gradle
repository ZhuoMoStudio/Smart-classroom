plugins {
    id "com.android.application"
    // AGP 9+ 已内置 Kotlin 支持，无需手动 apply kotlin-android 插件
    // id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.zhuomostudio.smart_classroom"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.zhuomostudio.smart_classroom"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties.getProperty('keyAlias', '')
            keyPassword = keystoreProperties.getProperty('keyPassword', '')
            storeFile = keystoreProperties.getProperty('storeFile') ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties.getProperty('storePassword', '')
        }
    }

    buildTypes {
        release {
            signingConfig = (keystoreProperties.getProperty('keyAlias', null) != null)
                ? signingConfigs.release
                : signingConfigs.debug
            // R8 保持关闭，理由不是"会坏事"，而是**收益不抵风险**：
            // Flutter 应用的 Java 侧只有极薄的一层胶水，真正占体积的是
            // Dart AOT 快照与 pdfrx 的 PDFium 原生库，R8 影响不到它们；
            // 而 audioplayers / flutter_secure_storage / file_picker 这些插件
            // 一旦缺 keep 规则，出事是在老师的手机上崩溃，构建阶段看不出来。
            // 真要开，请先补全 keep 规则并在真机上完整回归。
            minifyEnabled false
            shrinkResources false
        }
    }

    // APK 里的依赖元数据块（META-INF 下）对运行时没有作用，
    // 关掉既能少几十 KB，也不把内部依赖清单交给分发对象。
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
